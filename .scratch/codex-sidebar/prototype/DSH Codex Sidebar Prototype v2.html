<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>DSH Codex Sidebar · hi-fi</title>
  <!--
    THROW AWAY · visual pass on frozen IA.
    Assumptions:
    - Host and 侧栏 share one theme (dark default, light via toggle).
    - Palette / Browser empty / tab chrome = Codex App IA.
    - Files = Cursor layout (preview left, tree right, tree closable).
    - Review = GitHub-like unified diff + Uncommitted list.
    - Same clicks as v1. Not production.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root, html[data-theme="dark"] {
      --bg: #12141a;
      --rail: #0c0d11;
      --panel: #181b22;
      --lift: #22262f;
      --line: rgba(255,255,255,.07);
      --ink: #ecece8;
      --muted: #8c9098;
      --faint: #5e626a;
      --accent: #7aa2ff;
      --warn: #d4a054;
      --ok: #3dd68c;
      --chip: #2a2e38;
      --hover: #252a34;
      --danger: #e85d5d;
      --page: #08090c;
      --add-bg: rgba(61,214,140,.12);
      --del-bg: rgba(232,93,93,.14);
    }
    html[data-theme="light"] {
      --bg: #f4f4f1;
      --rail: #ecece8;
      --panel: #ffffff;
      --lift: #e8e8e4;
      --line: rgba(0,0,0,.08);
      --ink: #1c1c1c;
      --muted: #6a6a66;
      --faint: #9a9a94;
      --accent: #3d6fd8;
      --warn: #9a6b24;
      --ok: #1a7f37;
      --chip: #ececea;
      --hover: #e4e4de;
      --danger: #cf222e;
      --page: #e4e4de;
      --add-bg: #e6ffec;
      --del-bg: #ffebe9;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: "Source Sans 3", sans-serif;
      background: var(--page);
      color: var(--ink);
      letter-spacing: -0.011em;
    }
    button, input, textarea { font-family: inherit; }
    button { color: inherit; }
    .shell {
      display: grid;
      height: 100%;
      background: var(--bg);
    }
    .shell.open { grid-template-columns: 232px minmax(0, 1fr) 452px; }
    .shell.shut { grid-template-columns: 232px minmax(0, 1fr); }

    .rail {
      background: var(--rail);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0 8px 14px;
    }
    .rail-new {
      margin: 0 4px 16px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      border: 1px dashed rgba(255,255,255,.1);
    }
    .rail-k {
      font-size: 11px;
      color: var(--faint);
      padding: 8px 10px 6px;
      font-weight: 500;
    }
    .rec {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--muted);
    }
    .rec.on { background: var(--lift); color: var(--ink); }
    .rail-user { margin-top: auto; font-size: 12.5px; color: var(--faint); padding: 8px 10px; }

    .chat { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .topbar h1 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.02em; }
    .topbar .sub { font-size: 11.5px; color: var(--faint); margin-top: 1px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); display: inline-block; }
    .dot.idle { background: var(--faint); }
    .icon-btn {
      width: 32px; height: 32px;
      border: 0; border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--lift); color: var(--ink); }
    .icon-btn.on { background: var(--lift); color: var(--ink); }

    .msgs {
      flex: 1; overflow: auto;
      padding: 28px 36px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .bubble { max-width: 560px; font-size: 14.5px; line-height: 1.6; text-wrap: pretty; }
    .bubble.human { color: var(--muted); }
    .file-link {
      color: var(--accent);
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12.5px;
      background: rgba(122,162,255,.1);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .url-link { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .working { margin-top: 10px; font-size: 12.5px; color: var(--warn); }
    .delivery {
      max-width: 560px;
      background: var(--lift);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      border: 1px solid rgba(122,162,255,.28);
    }
    .delivery .k { font-size: 11px; color: var(--accent); margin-bottom: 4px; font-weight: 600; }
    .queue { font-size: 12.5px; color: var(--warn); }

    .composer-wrap { padding: 14px 18px 18px; }
    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px 10px;
    }
    .chips { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .chip { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
    .composer textarea {
      width: 100%; background: transparent; border: 0; color: var(--ink);
      outline: none; font-size: 14.5px; resize: none; line-height: 1.45;
    }
    .composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .access { font-size: 12.5px; color: var(--warn); font-weight: 500; }
    .ghost {
      background: transparent; border: 0; color: var(--faint); cursor: pointer; font-size: 11.5px;
    }
    .send {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent); border: 0; color: #0c1018;
      cursor: pointer; display: grid; place-items: center;
    }

    .cx {
      background: var(--panel);
      color: var(--ink);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .tabbar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      flex-shrink: 0;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border-radius: 7px;
      font-size: 12.5px;
      max-width: 148px;
      cursor: pointer;
      color: var(--muted);
      user-select: none;
    }
    .tab .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .x { opacity: 0; color: var(--faint); display: grid; place-items: center; }
    .tab:hover, .tab.on { color: var(--ink); }
    .tab.on { background: var(--lift); box-shadow: 0 0 0 1px var(--line); }
    .tab:hover .x, .tab.on .x { opacity: 1; }
    .plus {
      width: 26px; height: 26px; border: 0; background: transparent;
      color: var(--muted); cursor: pointer; display: grid; place-items: center; border-radius: 6px;
    }
    .plus:hover { background: var(--hover); color: var(--ink); }

    .cx-body { flex: 1; overflow: auto; min-height: 0; position: relative; }
    .cx-body.pad { padding: 14px 14px 12px; }
    .cx-body.center { display: flex; align-items: center; justify-content: center; }
    .cx-body.fill { display: flex; flex-direction: column; padding: 0; overflow: hidden; }

    .palette { width: 300px; display: flex; flex-direction: column; gap: 1px; }
    .pal-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 12px; border-radius: 10px; cursor: pointer; color: var(--ink);
    }
    .pal-row:hover { background: var(--hover); }
    .pal-row svg { color: var(--muted); flex-shrink: 0; }
    .pal-row .label { flex: 1; font-size: 14.5px; font-weight: 500; letter-spacing: -0.015em; }
    .pal-row .sc {
      font-size: 12px; color: var(--muted); background: var(--chip);
      padding: 3px 9px; border-radius: 999px; font-weight: 500;
      font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    }

    .rev { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .rev-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .branch { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
    .seg { margin-left: auto; display: flex; background: var(--lift); border-radius: 8px; padding: 2px; }
    .seg button {
      border: 0; background: transparent; padding: 4px 10px; border-radius: 6px;
      font-size: 11.5px; cursor: pointer; color: var(--muted);
    }
    .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
    .rev-k { font-size: 11px; color: var(--faint); margin-bottom: 4px; display: flex; justify-content: space-between; padding: 0 4px; font-weight: 500; letter-spacing: .04em; }
    .rev-list { flex: 1; overflow: auto; }
    .rev-row {
      display: flex; align-items: baseline; gap: 8px;
      padding: 9px 8px; cursor: pointer; border-radius: 8px;
    }
    .rev-row:hover { background: var(--hover); }
    .rev-name { font-size: 13.5px; font-weight: 500; }
    .rev-dir { font-size: 12px; color: var(--faint); }
    .rev-stat { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 12px; white-space: nowrap; }
    .addn { color: var(--ok); } .deln { color: var(--danger); }

    .diff {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin: 0 4px 10px;
      background: var(--bg);
    }
    .diff-hunk { padding: 5px 12px; color: var(--faint); background: var(--lift); font-size: 11px; }
    .diff-row { display: grid; grid-template-columns: 22px 34px 34px 14px 1fr; align-items: stretch; }
    .diff-row.add { background: var(--add-bg); }
    .diff-row.del { background: var(--del-bg); }
    .gutter { display: flex; align-items: center; justify-content: center; }
    .gutter-plus {
      width: 16px; height: 16px; border: 0; border-radius: 3px;
      background: var(--ok); color: var(--bg); cursor: pointer; font-size: 13px; line-height: 16px; padding: 0;
    }
    .ln { text-align: right; padding: 3px 7px 3px 0; color: var(--faint); }
    .ln.del { color: var(--danger); } .ln.add { color: var(--ok); }
    .sign { padding-top: 3px; color: var(--faint); }
    .sign.add { color: var(--ok); } .sign.del { color: var(--danger); }
    .code { padding: 3px 8px 3px 0; white-space: pre; color: var(--ink); }

    .gh-comment { background: var(--panel); padding: 10px 12px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .gh-comment textarea {
      width: 100%; min-height: 68px; background: var(--bg); border: 1px solid var(--ok);
      border-radius: 6px; color: var(--ink); padding: 8px 10px; font-size: 13px; resize: vertical; outline: none;
    }
    .gh-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; align-items: center; }
    .btn-cancel { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; }
    .btn-comment {
      background: var(--ok); color: var(--bg); border: 0; border-radius: 6px;
      padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .hint { font-size: 11px; color: var(--faint); }
    kbd {
      font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
      background: var(--chip); color: var(--muted); padding: 1px 5px; border-radius: 4px;
    }
    .btn-comment kbd { background: rgba(255,255,255,.18); color: #fff; }

    .files { display: flex; flex: 1; min-height: 0; height: 100%; }
    .preview { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
    .preview.split { border-right: 1px solid var(--line); }
    .fh {
      height: 36px; display: flex; align-items: center; gap: 8px;
      padding: 0 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
      background: var(--panel); flex-shrink: 0;
    }
    .fh .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .fh .dir { color: var(--faint); }
    .tool {
      width: 26px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      background: transparent; color: var(--muted); display: grid; place-items: center;
    }
    .tool:hover { background: var(--hover); }
    .tool.on { background: var(--ink); color: var(--bg); }
    .code-preview {
      flex: 1; overflow: auto; font-family: "IBM Plex Mono", monospace;
      font-size: 12.5px; line-height: 1.6; padding: 10px 0;
    }
    .code-preview.mark { cursor: crosshair; }
    .code-line { display: grid; grid-template-columns: 44px 1fr; }
    .code-line .n { text-align: right; padding-right: 14px; color: var(--faint); user-select: none; }
    .code-line .t { color: var(--ink); white-space: pre; padding-right: 16px; }

    .tree {
      width: 156px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel);
    }
    .tree-body { flex: 1; overflow: auto; padding: 8px 6px; font-size: 12.5px; }
    .tree-folder {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 6px; color: var(--muted); font-weight: 500;
    }
    .tree-file {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 6px 4px 22px; border-radius: 6px; cursor: pointer; color: var(--muted);
    }
    .tree-file.root { padding-left: 6px; }
    .tree-file.on { background: var(--lift); color: var(--ink); }

    .b-chrome {
      display: flex; align-items: center; gap: 2px;
      padding: 8px 10px; border-bottom: 1px solid var(--line);
      background: var(--panel); flex-shrink: 0;
    }
    .nav {
      width: 28px; height: 28px; border: 0; border-radius: 6px;
      background: transparent; display: grid; place-items: center;
    }
    .nav.on { color: var(--ink); cursor: pointer; }
    .nav.off { color: var(--faint); cursor: default; }
    .nav.on:hover { background: var(--hover); }
    .b-url {
      flex: 1; display: flex; align-items: center;
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px; height: 32px; padding: 0 6px 0 10px;
    }
    .b-url input {
      flex: 1; background: transparent; border: 0; color: var(--ink);
      outline: none; font-size: 12.5px; padding: 0;
    }
    .b-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; color: var(--faint); background: var(--bg);
    }
    .b-empty h2 { margin: 10px 0 0; font-size: 17px; font-weight: 600; color: var(--muted); letter-spacing: -0.02em; }
    .b-empty p { margin: 0; font-size: 13px; color: var(--faint); }
    .fake-page { flex: 1; background: #f3efe6; display: flex; align-items: center; justify-content: center; }
    .fake-card { width: 260px; }
    .fake-card h1 { margin: 0; font-family: "Iowan Old Style", Palatino, "Palatino Linotype", serif; font-size: 28px; font-weight: 500; color: #1a1a1a; }
    .fake-card button {
      margin-top: 18px; background: #111; color: #fff; border: 0;
      padding: 9px 18px; border-radius: 6px; font-size: 13.5px;
    }

    .term {
      background: var(--bg); color: var(--ink);
      font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
      padding: 14px 16px; flex: 1; min-height: 0; overflow: auto; line-height: 1.55;
    }
    .term .prompt { color: var(--ok); }
    .term form { display: flex; }
    .term input { background: transparent; border: 0; color: var(--ink); outline: none; flex: 1; font-family: inherit; font-size: inherit; }

    .side { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
    .side-msgs { flex: 1; overflow: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .side-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; color: var(--faint); padding: 0 24px 12px;
    }
    .side-empty h2 { margin: 10px 0 0; font-size: 17px; font-weight: 600; color: var(--muted); letter-spacing: -0.02em; }
    .side-empty p { margin: 0; font-size: 13px; color: var(--faint); text-align: center; max-width: 260px; line-height: 1.45; }
    .s-user { font-size: 13.5px; color: var(--ink); font-weight: 500; }
    .s-bot { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
    .roster { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .roster-h { font-size: 11px; color: var(--faint); padding: 8px 12px 4px; font-weight: 600; }
    .roster-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-top: 1px solid var(--line);
    }
    .st { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
    .st.busy { background: var(--warn); }
    .roster-row .t { flex: 1; font-size: 13px; }
    .roster-row .cwd { font-size: 11.5px; color: var(--faint); }
    .mini {
      font-size: 11.5px; border: 1px solid var(--line); background: var(--lift);
      border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink);
    }
    .mini:hover { background: var(--hover); }
    .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; }
    .pcard b { font-size: 13px; }
    .pcard .m { color: var(--muted); margin-top: 4px; font-size: 12.5px; line-height: 1.45; }
    .side-harness { padding: 8px 12px 14px; flex-shrink: 0; }
    .harness {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 12px 14px 10px;
    }
    .harness textarea {
      width: 100%; background: transparent; border: 0; color: var(--ink);
      outline: none; font-size: 14.5px; resize: none; line-height: 1.45; min-height: 44px;
    }
    .harness-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; position: relative; }
    .h-btn {
      width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent;
      color: var(--muted); cursor: pointer; display: grid; place-items: center;
    }
    .h-btn:hover { background: var(--hover); }
    .h-chip { font-size: 12.5px; color: var(--warn); font-weight: 500; margin-left: 2px; }
    .h-chip.ok { color: var(--ok); }
    .harness-row .send { margin-left: auto; background: var(--ink); color: var(--bg); }
    .plus-pop {
      position: absolute; bottom: 36px; left: 0; background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,.28); min-width: 148px; padding: 4px; z-index: 4;
    }
    .plus-pop button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: 8px 10px; border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--ink);
    }
    .plus-pop button:hover { background: var(--hover); }

    .note-dock {
      position: absolute;
      z-index: 6;
      width: max-content;
      min-width: 248px;
      max-width: min(360px, calc(100% - 24px));
      background: var(--lift);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      border-radius: 999px;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      pointer-events: auto;
    }
    .note-dock input {
      width: 100%; border: 0; outline: none; font-size: 12.5px;
      background: transparent; color: var(--ink); letter-spacing: -0.01em;
    }
    .note-dock input::placeholder { color: var(--muted); }
    .code-line.mark-on:hover { background: var(--hover); }
    .code-line.hit { background: var(--add-bg); }
    .fake-page.mark { cursor: crosshair; }
    .fake-card button.hit { outline: 2px solid var(--ok); outline-offset: 3px; }

    .proto {
      font-size: 10px; color: var(--faint); padding: 4px 10px;
      border-top: 1px solid var(--line); background: var(--bg);
    }
    .proto summary { cursor: pointer; }
    .proto pre { white-space: pre-wrap; color: var(--muted); }

    .flash {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--bg); padding: 8px 14px;
      border-radius: 999px; font-size: 12.5px; z-index: 40;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TOOLS = [
      { kind: "Review", label: "Review", icon: "review", shortcut: "Ctrl+Shift+G" },
      { kind: "Terminal", label: "Terminal", icon: "terminal", shortcut: "Ctrl+`" },
      { kind: "Browser", label: "Browser", icon: "globe", shortcut: "Ctrl+T" },
      { kind: "Files", label: "Files", icon: "folder", shortcut: "Ctrl+P" },
      { kind: "Side Chat", label: "Side chat", icon: "chat", shortcut: "Ctrl+Alt+S" },
    ];

    const LOGIN_SRC = `export function Login() {
  return (
    <form>
      <h1>Sign in</h1>
      <button className="submit">Continue</button>
    </form>
  );
}`;

    const README_SRC = `# foo

npm run dev`;

    const REVIEW_TURN = [
      {
        key: "src/Login.tsx",
        name: "Login.tsx",
        dir: "src",
        added: 8,
        removed: 2,
        hunk: "@@ -4,6 +4,12 @@",
        lines: [
          { type: "ctx", oldNo: 4, newNo: 4, text: "  return (" },
          { type: "ctx", oldNo: 5, newNo: 5, text: "    <form>" },
          { type: "del", oldNo: 6, newNo: null, text: "      <button>OK</button>" },
          { type: "add", oldNo: null, newNo: 6, text: "      <h1>Sign in</h1>" },
          { type: "add", oldNo: null, newNo: 7, text: '      <button className="submit">Continue</button>' },
          { type: "ctx", oldNo: 7, newNo: 8, text: "    </form>" },
          { type: "ctx", oldNo: 8, newNo: 9, text: "  );" },
        ],
      },
    ];

    const REVIEW_TREE = [
      ...REVIEW_TURN,
      {
        key: "notes.md",
        name: "notes.md",
        dir: "",
        added: 12,
        removed: 0,
        hunk: "@@ -0,0 +1,12 @@",
        lines: [
          { type: "add", oldNo: null, newNo: 1, text: "# leftover" },
          { type: "add", oldNo: null, newNo: 2, text: "local scratch — not this turn" },
        ],
      },
    ];

    const ROSTER = [
      { id: "A", title: "Run login", cwd: "foo/", busy: true },
      { id: "B", title: "API 改动", cwd: "bar/", busy: false },
      { id: "C", title: "docs site", cwd: "docs/", busy: false },
    ];

    let seq = 1;
    const nid = () => "t" + seq++;

    function Ico({ name, size = 16, sw = 1.6 }) {
      const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: sw, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true };
      switch (name) {
        case "review":
          return <svg {...p}><rect x="4.5" y="4.5" width="15" height="15" rx="2.5" /><path d="M12 8.5v7M8.5 12h7" /></svg>;
        case "terminal":
          return <svg {...p}><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" /><path d="M7.5 9.5l3 2.5-3 2.5M12.5 14.5h4" /></svg>;
        case "globe":
          return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.4 3.2 2.4 14.8 0 18M12 3c-2.4 3.2-2.4 14.8 0 18" /></svg>;
        case "folder":
          return <svg {...p}><path d="M3.5 8h5.2l1.8 2H20.5v9.5H3.5z" /><path d="M3.5 8V6.4A1.4 1.4 0 014.9 5h3.6l1.5 1.6" /></svg>;
        case "chat":
          return <svg {...p}><path d="M20.2 11.2a7.4 7.4 0 01-8.1 7.4L6 21.2l.7-3.3A7.4 7.4 0 1119.6 8" /><path d="M12 9v5M9.5 11.5h5" /></svg>;
        case "panel":
          return <svg {...p}><rect x="3.5" y="4.5" width="17" height="15" rx="2" /><path d="M15.5 4.5v15" /></svg>;
        case "plus":
          return <svg {...p}><path d="M12 6v12M6 12h12" /></svg>;
        case "x":
          return <svg {...p}><path d="M7 7l10 10M17 7L7 17" /></svg>;
        case "pencil":
          return <svg {...p}><path d="M4 20l.8-4L16.7 4.1a1.5 1.5 0 012.1 0l1.1 1.1a1.5 1.5 0 010 2.1L7.9 19.2 4 20z" /></svg>;
        case "back":
          return <svg {...p}><path d="M14.5 6l-6 6 6 6" /></svg>;
        case "fwd":
          return <svg {...p}><path d="M9.5 6l6 6-6 6" /></svg>;
        case "refresh":
          return <svg {...p}><path d="M20 12a8 8 0 10-2.3 5.5" /><path d="M20 12V6.8M20 12h-5.2" /></svg>;
        case "external":
          return <svg {...p}><path d="M14 5h5v5M19 5l-8.5 8.5" /><path d="M11 6.5H6.8A1.3 1.3 0 005.5 7.8v9.4A1.3 1.3 0 006.8 18.5h9.4a1.3 1.3 0 001.3-1.3V13" /></svg>;
        case "branch":
          return <svg {...p}><circle cx="6.5" cy="6.5" r="2.1" /><circle cx="6.5" cy="17.5" r="2.1" /><circle cx="17.5" cy="12" r="2.1" /><path d="M6.5 8.6v6.8M6.5 12h8.6" /></svg>;
        case "tree":
          return <svg {...p}><path d="M9 6h11M9 12h11M9 18h11M5.2 6h.01M5.2 12h.01M5.2 18h.01" /></svg>;
        case "file":
          return <svg {...p}><path d="M7 4.5h6.5L18 9v10.5H7z" /><path d="M13.5 4.5V9H18" /></svg>;
        case "up":
          return <svg {...p}><path d="M6 14l6-6 6 6" /></svg>;
        case "sun":
          return <svg {...p}><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" /></svg>;
        case "moon":
          return <svg {...p}><path d="M16.5 13.5A7 7 0 1110 4.6 5.5 5.5 0 0016.5 13.5z" /></svg>;
        default:
          return null;
      }
    }

    function tabIcon(kind) {
      if (kind === "Review") return "review";
      if (kind === "Terminal") return "terminal";
      if (kind === "Browser") return "globe";
      if (kind === "Files") return "folder";
      if (kind === "Side Chat") return "chat";
      return "plus";
    }

    function ReviewView({ mode, setMode, openKey, setOpenKey, comment, setComment, onStack, onSend }) {
      const files = mode === "turn" ? REVIEW_TURN : REVIEW_TREE;
      const [hover, setHover] = useState(null);
      const inputRef = useRef(null);

      useEffect(() => {
        if (comment && inputRef.current) inputRef.current.focus();
      }, [comment]);

      return (
        <div className="rev">
          <div className="rev-head">
            <span className="branch"><Ico name="branch" size={13} /> master</span>
            <div className="seg">
              {["turn", "tree"].map((m) => (
                <button key={m} className={mode === m ? "on" : ""} onClick={() => { setMode(m); setOpenKey(m === mode ? openKey : files[0] && files[0].key); }}>
                  {m === "turn" ? "本轮变更" : "工作区"}
                </button>
              ))}
            </div>
          </div>
          <div className="rev-k"><span>Uncommitted</span><span>只读</span></div>
          <div className="rev-list">
            {files.map((file) => {
              const open = openKey === file.key;
              return (
                <div key={file.key}>
                  <div className="rev-row" onClick={() => setOpenKey(open ? null : file.key)}>
                    <span className="rev-name">{file.name}</span>
                    {file.dir ? <span className="rev-dir">{file.dir}</span> : null}
                    <span className="rev-stat"><span className="addn">+{file.added}</span>{" "}<span className="deln">−{file.removed}</span></span>
                  </div>
                  {open && (
                    <div className="diff">
                      <div className="diff-hunk">{file.hunk}</div>
                      {file.lines.map((ln, i) => {
                        const hk = file.key + ":" + i;
                        const showPlus = hover === hk;
                        return (
                          <React.Fragment key={i}>
                            <div
                              className={"diff-row " + (ln.type === "add" ? "add" : ln.type === "del" ? "del" : "")}
                              onMouseEnter={() => setHover(hk)}
                              onMouseLeave={() => setHover((h) => (h === hk ? null : h))}
                            >
                              <div className="gutter">
                                {showPlus && (
                                  <button className="gutter-plus" title="批注此行" onClick={(e) => { e.stopPropagation(); setComment({ file: file.key, line: ln.newNo || ln.oldNo, text: ln.text.trim(), draft: "" }); }}>+</button>
                                )}
                              </div>
                              <div className={"ln " + (ln.type === "del" ? "del" : "")}>{ln.oldNo || ""}</div>
                              <div className={"ln " + (ln.type === "add" ? "add" : "")}>{ln.newNo || ""}</div>
                              <div className={"sign " + ln.type}>{ln.type === "add" ? "+" : ln.type === "del" ? "−" : " "}</div>
                              <div className="code">{ln.text}</div>
                            </div>
                            {comment && comment.file === file.key && comment.line === (ln.newNo || ln.oldNo) && (
                              <div className="gh-comment" onClick={(e) => e.stopPropagation()}>
                                <textarea
                                  ref={inputRef}
                                  placeholder="Leave a comment"
                                  value={comment.draft}
                                  onChange={(e) => setComment({ ...comment, draft: e.target.value })}
                                  onKeyDown={(e) => {
                                    if (e.key === "Escape") { e.preventDefault(); setComment(null); }
                                    if (e.key === "Enter" && e.ctrlKey) {
                                      e.preventDefault();
                                      onSend(`${file.key}:${comment.line} ${comment.draft || comment.text}`);
                                      setComment(null);
                                    } else if (e.key === "Enter" && !e.shiftKey) {
                                      e.preventDefault();
                                      onStack(`${file.key}:${comment.line} ${comment.draft || comment.text}`);
                                      setComment(null);
                                    }
                                  }}
                                />
                                <div className="gh-actions">
                                  <button className="btn-cancel" onClick={() => setComment(null)}>Cancel <kbd>Esc</kbd></button>
                                  <button className="btn-comment" onClick={() => { onStack(`${file.key}:${comment.line} ${comment.draft || comment.text}`); setComment(null); }}>
                                    Comment <kbd>Enter</kbd>
                                  </button>
                                  <span className="hint">Ctrl+Enter 发给主会话</span>
                                </div>
                              </div>
                            )}
                          </React.Fragment>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function CodePreview({ code, annotate, markedLine, onMark }) {
      const lines = code.split("\n");
      return (
        <div className={"code-preview" + (annotate ? " mark" : "")}>
          {lines.map((line, i) => (
            <div
              className={"code-line" + (annotate ? " mark-on" : "") + (markedLine === i + 1 ? " hit" : "")}
              key={i}
              onClick={(e) => { if (annotate) { e.stopPropagation(); onMark(i + 1, e); } }}
            >
              <span className="n">{i + 1}</span>
              <span className="t">{line || " "}</span>
            </div>
          ))}
        </div>
      );
    }

    function App() {
      const [collapsed, setCollapsed] = useState(false);
      const [tabs, setTabs] = useState([]);
      const [active, setActive] = useState(null);
      const [reviewMode, setReviewMode] = useState("turn");
      const [reviewOpen, setReviewOpen] = useState(null);
      const [reviewComment, setReviewComment] = useState(null);
      const [filePath, setFilePath] = useState("src/Login.tsx");
      const [fileTreeOpen, setFileTreeOpen] = useState(true);
      const [browserUrl, setBrowserUrl] = useState("");
      const [urlDraft, setUrlDraft] = useState("");
      const [browserHist, setBrowserHist] = useState([]);
      const [browserIdx, setBrowserIdx] = useState(-1);
      const [annotate, setAnnotate] = useState(false);
      const [draftNote, setDraftNote] = useState("");
      const [pendingMark, setPendingMark] = useState(null);
      const [notePos, setNotePos] = useState(null);
      const [attachments, setAttachments] = useState([]);
      const [composer, setComposer] = useState("");
      const [queue, setQueue] = useState([]);
      const [working, setWorking] = useState(true);
      const [termLines, setTermLines] = useState([]);
      const [termIn, setTermIn] = useState("");
      const [sideMsgs, setSideMsgs] = useState([]);
      const [sideDraft, setSideDraft] = useState("");
      const [plusOpen, setPlusOpen] = useState(false);
      const [forked, setForked] = useState(false);
      const [forkMeta, setForkMeta] = useState(null);
      const [listed, setListed] = useState(null);
      const [card, setCard] = useState(null);
      const [deliveries, setDeliveries] = useState([]);
      const [flash, setFlash] = useState("");
      const [theme, setTheme] = useState("dark");
      const noteRef = useRef(null);
      const bodyRef = useRef(null);

      const activeTab = tabs.find((t) => t.id === active);

      function expand() { setCollapsed(false); }

      function goUrl(url) {
        const u = (url || "").trim();
        setBrowserUrl(u);
        setUrlDraft(u);
        setAnnotate(false);
        setPendingMark(null);
        setNotePos(null);
        if (!u) return;
        setBrowserHist((h) => {
          const next = h.slice(0, browserIdx + 1).concat(u);
          setBrowserIdx(next.length - 1);
          return next;
        });
      }

      function openTool(kind, target) {
        expand();
        const reuse = tabs.find((t) => t.kind === kind && t.target === (target || "") && t.kind !== "Terminal" && t.kind !== "Side Chat" && t.kind !== "Review");
        if (reuse) { setActive(reuse.id); return reuse; }
        const id = nid();
        const tab = {
          id, kind, target: target || "",
          title: target ? target.replace(/^https?:\/\//, "").slice(0, 22) || kind : kind,
        };
        setTabs((ts) => [...ts, tab]);
        setActive(id);
        if (kind === "Files" && target) setFilePath(target);
        if (kind === "Browser" && target) goUrl(target);
        return tab;
      }

      function openEmpty() {
        expand();
        const id = nid();
        setTabs((ts) => [...ts, { id, kind: null, target: "", title: "New tab" }]);
        setActive(id);
      }

      function closeTab(id, e) {
        e && e.stopPropagation();
        setTabs((ts) => {
          const next = ts.filter((t) => t.id !== id);
          if (next.length === 0) { setActive(null); setCollapsed(true); }
          else if (active === id) setActive(next[next.length - 1].id);
          return next;
        });
      }

      function fillActive(kind) {
        expand();
        const empty = tabs.find((t) => t.id === active && !t.kind);
        if (empty) {
          setTabs((ts) => ts.map((t) => (t.id === empty.id ? { ...t, kind, title: kind, target: "" } : t)));
          return;
        }
        openTool(kind);
      }

      function addAttachment(text, from) {
        setAttachments((a) => [...a, { id: nid(), text, from }]);
        setFlash("批注已进主会话输入框");
      }

      function sendToMain(text, extra) {
        const payload = extra || attachments;
        if (working) { setQueue((q) => [...q, { text, payload }]); setFlash("主会话忙 · 已排队"); }
        else setFlash("已发给主会话");
        setAttachments([]);
        setComposer("");
      }

      function dismissNote() {
        setDraftNote("");
        setPendingMark(null);
        setNotePos(null);
      }

      function placeNote(label, e) {
        const pane = bodyRef.current;
        if (!pane) return;
        const r = pane.getBoundingClientRect();
        setPendingMark(label);
        setDraftNote("");
        setNotePos({ x: e.clientX - r.left, y: e.clientY - r.top });
      }

      function noteStyle() {
        const pane = bodyRef.current;
        if (!notePos || !pane) return { display: "none" };
        const w = pane.clientWidth;
        const h = pane.clientHeight;
        const dockW = 280;
        const dockH = 36;
        let left = notePos.x;
        let top = notePos.y + 12;
        left = Math.max(12 + dockW / 2, Math.min(left, w - 12 - dockW / 2));
        if (top + dockH > h - 8) top = notePos.y - dockH - 10;
        top = Math.max(8, top);
        return { left, top, transform: "translateX(-50%)" };
      }

      function onNoteKey(e) {
        if (e.key === "Escape") {
          e.preventDefault();
          dismissNote();
          return;
        }
        if (e.key === "Enter" && e.ctrlKey) {
          e.preventDefault();
          const text = draftNote || pendingMark || "批注";
          sendToMain(text, [...attachments, { id: nid(), text, from: pendingMark }]);
          dismissNote();
        } else if (e.key === "Enter") {
          e.preventDefault();
          addAttachment(draftNote || pendingMark || "批注", pendingMark);
          dismissNote();
        }
      }

      function sendSide() {
        const text = sideDraft.trim();
        if (!text) return;
        if (!forked) {
          setForked(true);
          setForkMeta({ at: "turn 1 · in-flight read src/Login.tsx", seq: 41 });
        }
        setSideMsgs((m) => [...m, { role: "user", text }, { role: "side", text: forked ? "仍按 Fork 那一刀答。要看现在，察看。" : "已 Fork 主会话（含本轮工具过程）。这刀冻住了。" }]);
        setSideDraft("");
      }

      function inspect(id) {
        const s = ROSTER.find((r) => r.id === id) || ROSTER[0];
        setCard({
          id: s.id, title: s.title, busy: s.busy,
          turn: s.id === "A" ? "turn 2 / step 1" : "idle",
          last: s.id === "A" ? "正在改 Login 按钮" : "上次：已推 API schema",
          files: s.id === "A" ? ["src/Login.tsx"] : ["internal/api.go"],
        });
      }

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);

      useEffect(() => {
        function onKey(e) {
          const tag = document.activeElement && document.activeElement.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA") return;
          if (e.key === "Escape" && pendingMark) { e.preventDefault(); dismissNote(); }
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "g") { e.preventDefault(); openTool("Review"); }
          if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "s") { e.preventDefault(); openTool("Side Chat"); }
        }
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      });

      useEffect(() => {
        if (pendingMark && noteRef.current) noteRef.current.focus();
      }, [pendingMark]);

      const empty = !activeTab || !activeTab.kind;
      const fillKind = activeTab && (activeTab.kind === "Terminal" || activeTab.kind === "Browser" || activeTab.kind === "Files" || activeTab.kind === "Side Chat");
      const showNote = !!pendingMark;
      const fileName = filePath.split("/").pop();
      const fileDir = filePath.includes("/") ? filePath.slice(0, filePath.lastIndexOf("/")) + "/" : "";

      return (
        <div className={"shell " + (collapsed ? "shut" : "open")}>
          <aside className="rail">
            <div className="brand">DSH</div>
            <div className="rail-new">New chat</div>
            <div className="rail-k">Recents</div>
            <div className="rec on">Run login</div>
            <div className="rec">API 改动</div>
            <div className="rail-user">noirbright</div>
          </aside>

          <main className="chat">
            <header className="topbar">
              <div>
                <h1>Run login</h1>
                <div className="sub"><span className={"dot" + (working ? "" : " idle")} />主会话 · foo/ · {working ? "Working" : "Idle"}</div>
              </div>
              <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                <button
                  className="icon-btn"
                  title={theme === "dark" ? "浅色主题" : "深色主题"}
                  onClick={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
                >
                  <Ico name={theme === "dark" ? "sun" : "moon"} size={16} />
                </button>
                <button className={"icon-btn" + (collapsed ? "" : " on")} title="侧栏开关" onClick={() => setCollapsed((c) => !c)}>
                  <Ico name="panel" size={16} />
                </button>
              </div>
            </header>
            <div className="msgs">
              <div className="bubble human">把登录页做出来，按钮要能批注。</div>
              <div className="bubble">
                已写 <span className="file-link" onClick={() => openTool("Files", "src/Login.tsx")}>src/Login.tsx</span>
                。页面在 <span className="url-link" onClick={() => openTool("Browser", "http://localhost:5173")}>http://localhost:5173</span>
                。本轮还在改。
                <div className="working">Working for 13s · read Login.tsx</div>
              </div>
              {deliveries.map((d) => (
                <div key={d.id} className="delivery">
                  <div className="k">投递 · {d.to} 的主会话将看到这张卡片（非用户消息）</div>
                  {d.text}
                </div>
              ))}
              {queue.length > 0 && <div className="queue">排队 {queue.length} 条（批注/消息）· 与普通对话相同</div>}
            </div>
            <div className="composer-wrap">
              <div className="composer">
                {attachments.length > 0 && (
                  <div className="chips">
                    <span className="chip">{attachments.length} annotations</span>
                    {attachments.map((a) => <span key={a.id} className="chip">{a.text.slice(0, 24)}</span>)}
                  </div>
                )}
                <textarea rows={2} placeholder="Do anything" value={composer} onChange={(e) => setComposer(e.target.value)} />
                <div className="composer-row">
                  <span className="access">Full access</span>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <button className="ghost" onClick={() => setWorking((w) => !w)}>{working ? "设为 Idle" : "设为 Working"}</button>
                    <button className="send" onClick={() => sendToMain(composer)} aria-label="send"><Ico name="up" size={14} sw="2.2" /></button>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {!collapsed && (
            <section className="cx">
              {tabs.some((t) => t.kind) && (
                <div className="tabbar">
                  {tabs.map((t) => (
                    <div key={t.id} className={"tab" + (t.id === active ? " on" : "")} onClick={() => { setActive(t.id); dismissNote(); }}>
                      <Ico name={tabIcon(t.kind)} size={13} />
                      <span className="title">{t.title}</span>
                      <span className="x" onClick={(e) => closeTab(t.id, e)}><Ico name="x" size={11} /></span>
                    </div>
                  ))}
                  <button className="plus" onClick={openEmpty} title="New tab"><Ico name="plus" size={14} /></button>
                </div>
              )}
              <div ref={bodyRef} className={"cx-body " + (empty ? "center" : fillKind ? "fill" : "pad")}>
                {empty && (
                  <div className="palette">
                    {TOOLS.map((tool) => (
                      <div key={tool.kind} className="pal-row" onClick={() => fillActive(tool.kind)}>
                        <Ico name={tool.icon} size={18} />
                        <span className="label">{tool.label}</span>
                        <span className="sc">{tool.shortcut}</span>
                      </div>
                    ))}
                  </div>
                )}
                {activeTab && activeTab.kind === "Review" && (
                  <ReviewView
                    mode={reviewMode}
                    setMode={setReviewMode}
                    openKey={reviewOpen}
                    setOpenKey={setReviewOpen}
                    comment={reviewComment}
                    setComment={setReviewComment}
                    onStack={(text) => addAttachment(text, "review")}
                    onSend={(text) => sendToMain(text, [...attachments, { id: nid(), text, from: "review" }])}
                  />
                )}
                {activeTab && activeTab.kind === "Files" && (
                  <div className="files">
                    <div className={"preview" + (fileTreeOpen ? " split" : "")}>
                      <div className="fh">
                        <span className="path"><span className="dir">{fileDir}</span>{fileName}</span>
                        <button title="批注" className={"tool" + (annotate ? " on" : "")} onClick={() => { setAnnotate((a) => !a); dismissNote(); }}>
                          <Ico name="pencil" size={14} />
                        </button>
                        {!fileTreeOpen && (
                          <button title="打开文件列表" className="tool" onClick={() => setFileTreeOpen(true)}>
                            <Ico name="tree" size={14} />
                          </button>
                        )}
                      </div>
                      <CodePreview
                        code={filePath === "src/Login.tsx" ? LOGIN_SRC : README_SRC}
                        annotate={annotate}
                        markedLine={pendingMark && pendingMark.startsWith(filePath) ? parseInt(pendingMark.split(":").pop(), 10) : null}
                        onMark={(line, e) => placeNote(filePath + ":" + line, e)}
                      />
                    </div>
                    {fileTreeOpen && (
                      <div className="tree">
                        <div className="fh">
                          <span style={{ flex: 1 }}>foo</span>
                          <button title="关闭列表" className="tool" onClick={() => setFileTreeOpen(false)}><Ico name="x" size={12} /></button>
                        </div>
                        <div className="tree-body">
                          <div className="tree-folder"><Ico name="folder" size={13} /> src</div>
                          <div className={"tree-file" + (filePath === "src/Login.tsx" ? " on" : "")} onClick={() => setFilePath("src/Login.tsx")}>
                            <Ico name="file" size={13} /> Login.tsx
                          </div>
                          <div className={"tree-file root" + (filePath === "README.md" ? " on" : "")} onClick={() => setFilePath("README.md")}>
                            <Ico name="file" size={13} /> README.md
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
                {activeTab && activeTab.kind === "Browser" && (() => {
                  const hasPage = !!browserUrl.trim();
                  const canBack = browserIdx > 0;
                  const canFwd = browserIdx >= 0 && browserIdx < browserHist.length - 1;
                  return (
                    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, height: "100%" }}>
                      <div className="b-chrome">
                        <button title="后退" className={"nav " + (canBack ? "on" : "off")} disabled={!canBack} onClick={() => {
                          if (!canBack) return;
                          const i = browserIdx - 1;
                          setBrowserIdx(i); setBrowserUrl(browserHist[i]); setUrlDraft(browserHist[i]); setAnnotate(false); dismissNote();
                        }}><Ico name="back" size={16} /></button>
                        <button title="前进" className={"nav " + (canFwd ? "on" : "off")} disabled={!canFwd} onClick={() => {
                          if (!canFwd) return;
                          const i = browserIdx + 1;
                          setBrowserIdx(i); setBrowserUrl(browserHist[i]); setUrlDraft(browserHist[i]); setAnnotate(false); dismissNote();
                        }}><Ico name="fwd" size={16} /></button>
                        <button title="刷新" className={"nav " + (hasPage ? "on" : "off")} onClick={() => { if (hasPage) setFlash("已刷新"); }}><Ico name="refresh" size={15} /></button>
                        <form className="b-url" onSubmit={(e) => { e.preventDefault(); goUrl(urlDraft); }}>
                          <input value={urlDraft} onChange={(e) => setUrlDraft(e.target.value)} placeholder="Enter a URL" />
                          <button type="button" title="外部打开" className={"nav " + (hasPage ? "on" : "off")} onClick={() => { if (hasPage) { window.open(browserUrl, "_blank", "noopener"); setFlash("已请求系统浏览器"); } }}>
                            <Ico name="external" size={14} />
                          </button>
                        </form>
                        {hasPage && browserUrl.includes("5173") && (
                          <button title="批注" className={"tool" + (annotate ? " on" : "")} onClick={() => { setAnnotate((a) => !a); dismissNote(); }}>
                            <Ico name="pencil" size={14} />
                          </button>
                        )}
                      </div>
                      {!hasPage && (
                        <div className="b-empty">
                          <Ico name="globe" size={56} sw="1.15" />
                          <h2>Start browsing</h2>
                          <p>Enter a URL to open a page</p>
                        </div>
                      )}
                      {hasPage && browserUrl.includes("5173") && (
                        <div className={"fake-page" + (annotate ? " mark" : "")}>
                          <div className="fake-card">
                            <h1
                              onClick={(e) => { if (annotate) { e.stopPropagation(); placeNote("h1.signin", e); } }}
                              style={{ cursor: annotate ? "crosshair" : "default" }}
                            >Sign in</h1>
                            <button
                              className={pendingMark === "button.submit" ? "hit" : ""}
                              style={{ cursor: annotate ? "crosshair" : "default" }}
                              onClick={(e) => { if (annotate) { e.stopPropagation(); placeNote("button.submit", e); } }}
                            >Continue</button>
                          </div>
                        </div>
                      )}
                      {hasPage && !browserUrl.includes("5173") && (
                        <div className="b-empty">
                          <Ico name="globe" size={40} sw="1.2" />
                          <h2>Unable to connect</h2>
                          <p>侧栏不起项目</p>
                        </div>
                      )}
                    </div>
                  );
                })()}
                {activeTab && activeTab.kind === "Terminal" && (
                  <div className="term">
                    {termLines.map((l, i) => <div key={i}>{l}</div>)}
                    <form onSubmit={(e) => { e.preventDefault(); setTermLines((ls) => [...ls, "noirbright@dsh:~/foo$ " + termIn, "ok"]); setTermIn(""); }}>
                      <span className="prompt">noirbright@dsh:~/foo$ </span>
                      <input value={termIn} onChange={(e) => setTermIn(e.target.value)} />
                    </form>
                  </div>
                )}
                {activeTab && activeTab.kind === "Side Chat" && (
                  <div className="side">
                    {sideMsgs.length === 0 && !listed && !card ? (
                      <div className="side-empty">
                        <Ico name="chat" size={56} sw="1.15" />
                        <h2>Side chat</h2>
                        <p>第一次发送时 Fork 主会话，不打断舵主。</p>
                      </div>
                    ) : (
                      <div className="side-msgs">
                        {sideMsgs.map((m, i) => (
                          <div key={i} className={m.role === "user" ? "s-user" : "s-bot"}>{m.text}</div>
                        ))}
                        {listed && (
                          <div className="roster">
                            <div className="roster-h">列出 · 全 profile 主会话</div>
                            {listed.map((s) => (
                              <div key={s.id} className="roster-row">
                                <span className={"st" + (s.busy ? " busy" : "")} />
                                <div style={{ flex: 1, minWidth: 0 }}>
                                  <div className="t">{s.title}</div>
                                  <div className="cwd">{s.cwd}</div>
                                </div>
                                <button className="mini" onClick={() => inspect(s.id)}>察看</button>
                                <button className="mini" onClick={() => { setDeliveries((d) => [...d, { id: nid(), to: s.title, text: "按这个登录方案改 API" }]); setFlash("投递卡片 → " + s.title + "（不是用户消息）"); }}>投递</button>
                              </div>
                            ))}
                          </div>
                        )}
                        {card && (
                          <div className="pcard">
                            <b>进度卡片 · {card.title}</b>
                            <div className="m">{card.busy ? "忙" : "闲"} · {card.turn}<br />{card.last}<br />{card.files.join(", ")}</div>
                          </div>
                        )}
                      </div>
                    )}
                    <div className="side-harness">
                      <div className="harness">
                        <textarea
                          rows={2}
                          value={sideDraft}
                          onChange={(e) => setSideDraft(e.target.value)}
                          onKeyDown={(e) => e.key === "Enter" && !e.shiftKey && (e.preventDefault(), sendSide())}
                          placeholder="不打断主会话来提问"
                        />
                        <div className="harness-row">
                          <button className="h-btn" title="更多" onClick={() => setPlusOpen((o) => !o)}><Ico name="plus" size={16} /></button>
                          {plusOpen && (
                            <div className="plus-pop">
                              <button onClick={() => { setListed(ROSTER); setPlusOpen(false); }}>列出</button>
                              <button onClick={() => { inspect("A"); setPlusOpen(false); }}>察看 A</button>
                            </div>
                          )}
                          <span className={"h-chip" + (forked ? " ok" : "")}>{forked ? "Fork 已冻" : "尚未 Fork"}</span>
                          <button className="send" onClick={sendSide} aria-label="send"><Ico name="up" size={14} sw="2.2" /></button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
                {showNote && (
                  <div className="note-dock" style={noteStyle()} onMouseDown={(e) => e.stopPropagation()}>
                    <input
                      ref={noteRef}
                      value={draftNote}
                      onChange={(e) => setDraftNote(e.target.value)}
                      onKeyDown={onNoteKey}
                      placeholder="批注  Enter 堆积 · Ctrl+Enter 发送"
                    />
                  </div>
                )}
              </div>
              <details className="proto">
                <summary>prototype state</summary>
                <pre>{JSON.stringify({ collapsed, tabs, active, attachments: attachments.length, forked, queue: queue.length }, null, 2)}</pre>
              </details>
            </section>
          )}
          {flash && <div className="flash">{flash}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
